<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<title>LUXECART - Premium Quality</title>
<style>
  @import url('https://fonts.googleapis.com/css2?family=Poppins:wght@400;700&display=swap');

  * {
    margin: 0;
    padding: 0;
    box-sizing: border-box;
  }

  body {
    width: 1440px;
    height: 818px;
    font-family: 'Poppins', sans-serif;
    display: flex;
    align-items: center;
    position: relative;
    overflow: hidden;
  }

  .orange-box {
    position: absolute;
    top: 0;
    right: 0;
    width: 620px;
    height: 100%;
    background-color: #E8622C;
  }

  .content {
    max-width: 485px;
    padding-left: 112px;
    position: relative;
    z-index: 1;
  }

  .content h1 {
    font-family: 'Poppins', sans-serif;
    font-weight: 700;
    font-size: 56px;
    line-height: 1.15;
    margin-bottom: 24px;
  }

  .content p {
    font-family: 'Poppins', sans-serif;
    font-weight: 400;
    font-size: 18px;
    line-height: 1.6;
  }
</style>
</head>
<body>
  <div class="orange-box"></div>
  <div class="content">
    <h1>Premium Quality</h1>
    <p>Discover carefully selected pieces that combine quality, comfort, and contemporary fashion.</p>
  </div>
</body>
</html>
